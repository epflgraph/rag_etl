[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-etl"
version = "0.1.0"
description = "An ETL pipeline for preparing data for retrieval-augmented generation (RAG)."
readme = "README.md"
authors = [
    { name = "Aitor Pérez Pérez", email = "aitor.perez@epfl.ch" },
    { name = "Javier Lloret Pardo", email = "javier.lloretpardo@epfl.ch" }
]
license = { text = "MIT" }
requires-python = ">=3.12"

# optional: your runtime dependencies
dependencies = [
    "python-dotenv",
    "pandas",
    "requests",
    "openai",
    "lxml",
    "google-genai",
    "bs4",
    "nbformat",
    "nbconvert",
    "pymupdf",
    "Pillow",
    "pathvalidate",     # sanitise user-input strings to use as filenames
    "langfuse",
    "KalturaApiClient",
]

[project.scripts]
rag-etl = "rag_etl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "I001",   # avoids import reordering
    "RUF012", # avoids linting in course_info and tag_metadata
    "RUF022", # avoids expecting alphabetical order
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Legacy modules, pre-refactor: type errors suppressed until each is rewritten.
# As a phase rewrites a module, remove its entry here so mypy gates it.
[[tool.mypy.overrides]]
module = [
    "rag_etl.config",
    "rag_etl.loaders.*",
    "rag_etl.extractors.*",
    "rag_etl.transformers.*",
    "rag_etl.utils.*",
    "rag_etl.projects.*",
    "rag_etl.resources.*",
]
ignore_errors = true